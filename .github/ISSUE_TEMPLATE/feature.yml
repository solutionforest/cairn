name: Feature request
description: Something Cairn should do. Scope is narrow on purpose (docs/DESIGN.md §0).
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what stops you today?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
  - type: textarea
    id: alternatives
    attributes:
      label: What you use instead today
