name: S3 compatibility
description: An S3 client or SDK behaves differently against Tidemark than against AWS S3.
labels: ["s3-compat", "triage"]
body:
  - type: markdown
    attributes:
      value: Check [docs/COMPAT.md](https://github.com/solutionforest/tidemark/blob/master/docs/COMPAT.md) first; documented deviations are listed there.
  - type: input
    id: version
    attributes: { label: Tidemark version, placeholder: 0.1.0-beta.1 }
    validations: { required: true }
  - type: input
    id: client
    attributes: { label: Client and version, placeholder: "rclone 1.68, aws-sdk-go-v2 1.30, ..." }
    validations: { required: true }
  - type: input
    id: operation
    attributes: { label: S3 operation, placeholder: "PutBucketLifecycleConfiguration" }
    validations: { required: true }
  - type: textarea
    id: details
    attributes:
      label: Request, Tidemark's response, and what AWS returns
      description: A link to the AWS docs for the expected behaviour helps. Redact secrets.
    validations: { required: true }
