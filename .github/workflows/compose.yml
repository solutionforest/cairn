name: compose

# Smoke test for the README's Docker Compose path: pull the published image, `docker compose
# --profile ui up`, then use S3 and the admin UI through the published ports. The dev host
# (gVisor) cannot run containers, so this is where the compose file is proven.
# A version bump in compose.yaml lands before its release image exists, so a push run skips when
# the tag is not on GHCR yet, and the run after the release workflow finishes does the test.
on:
  push:
    branches: [master]
    paths: ["compose.yaml", "admin-ui/**", "deploy/Dockerfile", ".github/workflows/compose.yml"]
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: docker compose up (published image + admin UI)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TIDEMARK_PORT: "19000"
      TIDEMARK_UI_PORT: "19080"
      COMPOSE_PROJECT_NAME: tidemark-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Published image exists (anonymous, as a README reader pulls it)
        id: image
        run: |
          image="$(TIDEMARK_ROOT_ACCESS_KEY=x TIDEMARK_ROOT_SECRET=x docker compose config --images | grep solutionforest/tidemark)"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "::notice::$image is not published yet; the run after the release workflow tests it"
          else
            echo "::error::$image cannot be pulled anonymously"; exit 1
          fi
      - name: .env as in the README
        if: steps.image.outputs.ok
        run: |
          printf 'TIDEMARK_ROOT_ACCESS_KEY=%s\nTIDEMARK_ROOT_SECRET=%s\n' \
            "$(openssl rand -hex 10)" "$(openssl rand -base64 30)" > .env && chmod 600 .env
      - name: up
        if: steps.image.outputs.ok
        run: |
          docker compose version
          docker compose --profile ui pull
          docker compose --profile ui up -d --no-build
          for i in $(seq 60); do curl -sf "http://127.0.0.1:$TIDEMARK_PORT/readyz" && break; sleep 1; done
          curl -sf "http://127.0.0.1:$TIDEMARK_PORT/readyz"
      - name: S3 and admin UI
        if: steps.image.outputs.ok
        run: |
          set -a; . ./.env; set +a
          s3() { curl -sf --aws-sigv4 "aws:amz:us-east-1:s3" -u "$TIDEMARK_ROOT_ACCESS_KEY:$TIDEMARK_ROOT_SECRET" \
            -H "x-amz-content-sha256: UNSIGNED-PAYLOAD" "$@"; }
          ep="http://127.0.0.1:$TIDEMARK_PORT"
          s3 -X PUT "$ep/compose-smoke"
          echo hello > hello.txt && s3 -T hello.txt "$ep/compose-smoke/hello.txt"
          test "$(s3 "$ep/compose-smoke/hello.txt")" = hello
          s3 -X DELETE "$ep/compose-smoke/hello.txt"
          ui="http://127.0.0.1:$TIDEMARK_UI_PORT"
          for i in $(seq 30); do curl -sf -o /dev/null "$ui/" && break; sleep 1; done
          curl -sf -H 'X-Tidemark-UI: 1' "$ui/api/buckets" | grep -q '"compose-smoke"'
          curl -sf -H 'X-Tidemark-UI: 1' "$ui/api/trash?bucket=compose-smoke" | grep -q '"hello.txt"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Tidemark-UI: 1' -H "Host: evil:$TIDEMARK_UI_PORT" "$ui/api/info")
          test "$code" = 403
      - name: restart keeps data
        if: steps.image.outputs.ok
        run: |
          docker compose --profile ui restart
          for i in $(seq 60); do curl -sf "http://127.0.0.1:$TIDEMARK_PORT/readyz" && break; sleep 1; done
          for i in $(seq 30); do curl -sf -o /dev/null "http://127.0.0.1:$TIDEMARK_UI_PORT/" && break; sleep 1; done
          curl -sf -H 'X-Tidemark-UI: 1' "http://127.0.0.1:$TIDEMARK_UI_PORT/api/buckets" | grep -q '"compose-smoke"'
      - name: logs
        if: failure() && steps.image.outputs.ok
        run: docker compose --profile ui logs --no-color
      - name: down
        if: always() && steps.image.outputs.ok
        run: docker compose --profile ui down -v --remove-orphans
