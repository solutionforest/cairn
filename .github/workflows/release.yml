# Release pipeline: push a `v*` tag -> static musl binaries (x86_64, aarch64) with embedded
# dependency metadata (cargo-auditable), per-binary CycloneDX SBOMs, SHA256SUMS, a GitHub Release
# whose notes come from CHANGELOG.md, and a multi-arch image on ghcr.io/solutionforest/tidemark.
# The first job fails the run unless CHANGELOG.md has a dated section and link for the tag.
#
# Decisions (see docs/BUILD-PLAN.md decisions log, 2026-11-08 Agent C):
# - runs-on: ubuntu-latest (GitHub-hosted, free for public repos). Nothing here depends on the
#   host arch (zig
#   cross-compiles both targets, and the image stages that run commands use $BUILDPLATFORM).
# - cargo-zigbuild, not cross: zig's bundled musl/libc headers and linker cross-compile `ring`'s C
#   and assembly to aarch64 without a Docker daemon or per-target images. cross would need
#   Docker-in-Docker and pull ~1 GB of toolchain images per target.
# - The image is assembled from the binaries built here (`release` target of deploy/Dockerfile),
#   so no Rust compile runs under QEMU and the image contains exactly the released bytes.
# - aarch64 links with thin LTO: fat LTO peaks at 6.1 GB RSS for that target and the runners kill
#   it (2026-11-09: 13.7 MiB fat vs 16.5 MiB thin, both under the E2 20 MB budget). x86_64 keeps
#   fat LTO, the profile E2 is measured on.
# - Third-party actions are pinned to commit SHAs (the tag is in the trailing comment) because
#   this workflow holds `contents: write` and `packages: write`.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0-alpha.2"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  changelog:
    name: Changelog entry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Require a CHANGELOG.md section for this tag
        run: |
          scripts/changelog-section.sh "${TAG#v}" CHANGELOG.md > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  build:
    name: build ${{ matrix.target }}
    needs: changelog
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            docker_arch: amd64
            lto: fat
          - target: aarch64-unknown-linux-musl
            docker_arch: arm64
            lto: thin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-zigbuild,cargo-auditable,cargo-audit
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}

      - name: Check tag matches the workspace version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="tidemark-cli"))')"
          case "$TAG" in
            "v$version"|"v$version"-*|"v$version"+*) echo "tag $TAG ~ version $version" ;;
            *) echo "::error::tag $TAG does not match workspace version $version"; exit 1 ;;
          esac

      - name: Build (static musl, auditable)
        env:
          CARGO_PROFILE_RELEASE_LTO: ${{ matrix.lto }}
        run: cargo auditable zigbuild --release --locked -p tidemark-cli --target ${{ matrix.target }}

      - name: Verify static linking and embedded audit data
        run: |
          bin=target/${{ matrix.target }}/release/tidemark
          file "$bin"
          file "$bin" | grep -Eq 'statically linked|static-pie linked'
          cargo audit bin "$bin"

      - name: Package
        id: pkg
        run: |
          name="tidemark-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name" "image/${{ matrix.docker_arch }}"
          cp target/${{ matrix.target }}/release/tidemark "dist/$name/"
          cp target/${{ matrix.target }}/release/tidemark "image/${{ matrix.docker_arch }}/tidemark"
          cp LICENSE README.md CHANGELOG.md SECURITY.md deploy/tidemark.example.toml deploy/tidemark.service "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: SBOM (CycloneDX, from the shipped binary's embedded dependency list)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: target/${{ matrix.target }}/release/tidemark
          format: cyclonedx-json
          output-file: dist/${{ steps.pkg.outputs.name }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.cdx.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.docker_arch }}
          path: image/
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz *.cdx.json > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --title "Tidemark $TAG" --notes-file notes.md "${flags[@]}" \
            dist/*.tar.gz dist/*.cdx.json dist/SHA256SUMS

  image:
    name: Container image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: dist/image
          merge-multiple: true
      - run: chmod 0755 dist/image/*/tidemark && ls -l dist/image/*
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/solutionforest/tidemark
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
          flavor: |
            latest=auto
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
