# Supply-chain checks: cargo-deny (licences, bans, sources, advisories) and cargo-audit (RustSec).
# Policy and documented exceptions live in deny.toml; cargo-audit reads its ignore list from
# .cargo/audit.toml, which must mirror deny.toml's [advisories].ignore.
name: security

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC: new advisories land without code changes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-deny:
    name: cargo deny
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --locked check --show-stats

  cargo-audit:
    name: cargo audit
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit (vulnerabilities fail; unmaintained/unsound are reported)
        run: cargo audit
