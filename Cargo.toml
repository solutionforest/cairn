[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/solutionforest/cairn"
rust-version = "1.88"

[workspace.dependencies]
cairn-core = { path = "crates/cairn-core", version = "0.1.0" }
cairn-meta = { path = "crates/cairn-meta", version = "0.1.0" }
cairn-blob = { path = "crates/cairn-blob", version = "0.1.0" }
cairn-auth = { path = "crates/cairn-auth", version = "0.1.0" }
cairn-engine = { path = "crates/cairn-engine", version = "0.1.0" }
cairn-s3 = { path = "crates/cairn-s3", version = "0.1.0" }
cairn-admin = { path = "crates/cairn-admin", version = "0.1.0" }
cairn-events = { path = "crates/cairn-events", version = "0.1.0" }
cairn-mcp = { path = "crates/cairn-mcp", version = "0.1.0" }
cairn-server = { path = "crates/cairn-server", version = "0.1.0" }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
async-trait = "0.1"
bytes = "1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tower-log", "tracing"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "timeout", "limit", "cors"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

s3s = "0.17"
s3s-aws = "0.17"
rmcp = { version = "3", features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars = "1"

redb = "4"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
quick-xml = { version = "0.42", features = ["serialize"] }

blake3 = "1"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
crc32fast = "1"
crc32c = "0.6"
crc64fast-nvme = "1"
hmac = "0.12"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
subtle = "2"
rand = "0.9"
base64 = "0.22"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
argon2 = "0.5"
# JWT verification for OIDC federation (pure-Rust RustCrypto backend; no OpenSSL / aws-lc).
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
# Test-only: generate RS256 / ES256 keys for local JWKS (same versions jsonwebtoken uses).
rsa = "0.9"
p256 = "0.13"

jiff = { version = "0.2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
url = "2"
globset = "0.4"
ipnet = "2"
regex = "1"
smallvec = { version = "1", features = ["serde"] }

thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
proptest = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }
aws-credential-types = "1"
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
# Prometheus text exposition for /metrics (pure Rust; protobuf format disabled).
prometheus = { version = "0.14", default-features = false }

[profile.dev]
debug = 0
[profile.dev.package."*"]
opt-level = 1
debug = 0
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
