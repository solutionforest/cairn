# Single-node Tidemark with Docker Compose.
#
#   1. Create .env with your root credential (once):
#        printf 'TIDEMARK_ROOT_ACCESS_KEY=%s\nTIDEMARK_ROOT_SECRET=%s\n' \
#          "$(openssl rand -hex 10)" "$(openssl rand -base64 30)" > .env && chmod 600 .env
#   2. docker compose up -d                  # S3 on http://127.0.0.1:9000
#      docker compose --profile ui up -d     # plus the admin UI on http://127.0.0.1:9080
#      Malware scanning with ClamAV: add TIDEMARK_SCAN_ENDPOINT=clamd://clamav:3310 to .env, then
#        docker compose --profile scan up -d
#      Infected uploads land in the `quarantine` bucket. Uploads are refused (503) until ClamAV
#      has downloaded its signatures (a few minutes on the first start).
#
# The image is pulled from GHCR (public, no login). `docker compose up -d --build` builds it from
# this checkout instead (slow: a full Rust build).
#
# The root credential is sealed into the credential store on the first start (empty volume);
# later starts ignore it. Data lives in the named volume `tidemark-data`: `docker compose down -v`
# deletes it. Back up with `tidemark backup` or a snapshot of the volume while the stack is stopped.
# Both ports are published on 127.0.0.1 only; put TLS and a firewall in front before opening them.
name: tidemark

services:
  tidemark:
    image: ghcr.io/solutionforest/tidemark:${TIDEMARK_VERSION:-0.1.0-alpha.3}
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: ["serve"]
    ports:
      - "127.0.0.1:${TIDEMARK_PORT:-9000}:9000"
    environment:
      TIDEMARK_DATA_DIR: /data
      TIDEMARK_SERVER_LISTEN: 0.0.0.0:9000
      TIDEMARK_SERVER_REGION: us-east-1
      TIDEMARK_LOG_JSON: "true"
      TIDEMARK_ROOT_ACCESS_KEY: ${TIDEMARK_ROOT_ACCESS_KEY:?create .env first, see the top of compose.yaml}
      TIDEMARK_ROOT_SECRET: ${TIDEMARK_ROOT_SECRET:?create .env first, see the top of compose.yaml}
      TIDEMARK_SCAN_ENDPOINT: ${TIDEMARK_SCAN_ENDPOINT:-}
    volumes:
      - tidemark-data:/data
      # Optional config file (every key: deploy/tidemark.example.toml); then also set
      # command: ["serve", "--config", "/etc/tidemark/tidemark.toml"]
      # - ./tidemark.toml:/etc/tidemark/tidemark.toml:ro
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    # distroless has no shell or curl for a HEALTHCHECK; probe from the host instead:
    #   curl -f http://127.0.0.1:9000/readyz
    stop_grace_period: 30s
    ulimits:
      nofile: { soft: 65536, hard: 65536 }

  # Admin UI (admin-ui/): opt in with `--profile ui`. It signs requests with the root key, so it
  # is published on the host's loopback only and has no login of its own; open it as
  # http://127.0.0.1:9080 (it checks the Host header, so `localhost` is refused).
  admin-ui:
    profiles: [ui]
    image: python:3.13-alpine
    restart: unless-stopped
    depends_on: [tidemark]
    command: ["python3", "/app/server.py"]
    ports:
      - "127.0.0.1:${TIDEMARK_UI_PORT:-9080}:${TIDEMARK_UI_PORT:-9080}"
    environment:
      TIDEMARK_ENDPOINT: http://tidemark:9000
      TIDEMARK_ACCESS_KEY: ${TIDEMARK_ROOT_ACCESS_KEY:?create .env first, see the top of compose.yaml}
      TIDEMARK_SECRET_KEY: ${TIDEMARK_ROOT_SECRET:?create .env first, see the top of compose.yaml}
      TIDEMARK_UI_PORT: ${TIDEMARK_UI_PORT:-9080}
      TIDEMARK_UI_BIND: 0.0.0.0
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./admin-ui:/app:ro
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # ClamAV for `[scan]` (opt in with `--profile scan` and TIDEMARK_SCAN_ENDPOINT, see the top).
  # Not published on the host; Tidemark reaches it on the compose network. Needs ~1.5 GiB RAM.
  clamav:
    profiles: [scan]
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav

volumes:
  tidemark-data:
  clamav-db:
