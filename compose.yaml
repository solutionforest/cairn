# Single-node Cairn with Docker Compose.
#
#   1. Create .env with your root credential (once):
#        printf 'CAIRN_ROOT_ACCESS_KEY=%s\nCAIRN_ROOT_SECRET=%s\n' \
#          "$(openssl rand -hex 10)" "$(openssl rand -base64 30)" > .env && chmod 600 .env
#   2. docker compose up -d                  # S3 on http://127.0.0.1:9000
#      docker compose --profile ui up -d     # plus the admin UI on http://127.0.0.1:9080
#
# The image is pulled from GHCR (private for now: `docker login ghcr.io` first). Without access,
# `docker compose up -d --build` builds it from this checkout instead (slow: a full Rust build).
#
# The root credential is sealed into the credential store on the first start (empty volume);
# later starts ignore it. Data lives in the named volume `cairn-data`: `docker compose down -v`
# deletes it. Back up with `cairn backup` or a snapshot of the volume while the stack is stopped.
# Both ports are published on 127.0.0.1 only; put TLS and a firewall in front before opening them.
name: cairn

services:
  cairn:
    image: ghcr.io/solutionforest/cairn:${CAIRN_VERSION:-0.1.0-alpha.1}
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: ["serve"]
    ports:
      - "127.0.0.1:${CAIRN_PORT:-9000}:9000"
    environment:
      CAIRN_DATA_DIR: /data
      CAIRN_SERVER_LISTEN: 0.0.0.0:9000
      CAIRN_SERVER_REGION: us-east-1
      CAIRN_LOG_JSON: "true"
      CAIRN_ROOT_ACCESS_KEY: ${CAIRN_ROOT_ACCESS_KEY:?create .env first, see the top of compose.yaml}
      CAIRN_ROOT_SECRET: ${CAIRN_ROOT_SECRET:?create .env first, see the top of compose.yaml}
    volumes:
      - cairn-data:/data
      # Optional config file (every key: deploy/cairn.example.toml); then also set
      # command: ["serve", "--config", "/etc/cairn/cairn.toml"]
      # - ./cairn.toml:/etc/cairn/cairn.toml:ro
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    # distroless has no shell or curl for a HEALTHCHECK; probe from the host instead:
    #   curl -f http://127.0.0.1:9000/readyz
    stop_grace_period: 30s
    ulimits:
      nofile: { soft: 65536, hard: 65536 }

  # Admin UI (admin-ui/): opt in with `--profile ui`. It signs requests with the root key, so it
  # is published on the host's loopback only and has no login of its own; open it as
  # http://127.0.0.1:9080 (it checks the Host header, so `localhost` is refused).
  admin-ui:
    profiles: [ui]
    image: python:3.13-alpine
    restart: unless-stopped
    depends_on: [cairn]
    command: ["python3", "/app/server.py"]
    ports:
      - "127.0.0.1:${CAIRN_UI_PORT:-9080}:${CAIRN_UI_PORT:-9080}"
    environment:
      CAIRN_ENDPOINT: http://cairn:9000
      CAIRN_ACCESS_KEY: ${CAIRN_ROOT_ACCESS_KEY:?create .env first, see the top of compose.yaml}
      CAIRN_SECRET_KEY: ${CAIRN_ROOT_SECRET:?create .env first, see the top of compose.yaml}
      CAIRN_UI_PORT: ${CAIRN_UI_PORT:-9080}
      CAIRN_UI_BIND: 0.0.0.0
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./admin-ui:/app:ro
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  cairn-data:
