[package]
name = "tidemark-blob"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Tidemark object storage: blob"

[dependencies]
tidemark-core.workspace = true
tokio.workspace = true
tokio-util.workspace = true
bytes.workspace = true
futures.workspace = true
blake3.workspace = true
md-5.workspace = true
sha1.workspace = true
sha2.workspace = true
crc32fast.workspace = true
crc32c.workspace = true
crc64fast-nvme.workspace = true
aes-gcm.workspace = true
chacha20poly1305.workspace = true
rand.workspace = true
zeroize.workspace = true
hex.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
aws-sdk-s3 = { workspace = true, optional = true }
aws-smithy-http-client = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }
rustix.workspace = true

[features]
# S3 client for backups to s3://, replication to remote S3 and the S3 cold tier. Off in release
# binaries: back up to a directory and sync it with rclone instead (OPERATIONS.md).
remote = ["dep:aws-sdk-s3", "dep:aws-smithy-http-client", "dep:aws-credential-types"]

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
