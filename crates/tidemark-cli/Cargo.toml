[package]
name = "tidemark-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Tidemark object storage: `tidemark` command-line binary"

[[bin]]
name = "tidemark"
path = "src/main.rs"

[dependencies]
tidemark-core.workspace = true
tidemark-server.workspace = true
tidemark-auth.workspace = true
tidemark-admin.workspace = true
tidemark-mcp.workspace = true
tidemark-blob.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true
toml.workspace = true
reqwest.workspace = true

[features]
remote = ["tidemark-server/remote", "tidemark-blob/remote"]
oidc = ["tidemark-auth/oidc"]

[dev-dependencies]
tempfile.workspace = true
aws-sdk-s3.workspace = true
aws-smithy-http-client.workspace = true
aws-credential-types.workspace = true
