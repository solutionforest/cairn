# cargo-deny policy. Run: `cargo deny check` (CI: .github/workflows/security.yml).
# Every exception below carries a reason and a review trigger; re-check them at each release.

[graph]
all-features = true

[licenses]
# Licences compatible with distributing Cairn under AGPL-3.0-only. Permissive and weak-copyleft
# (file-level MPL-2.0) only; no GPL-2.0-only, SSPL, BUSL or "non-commercial" licences.
allow = [
    "AGPL-3.0-only",            # Cairn's own crates
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CDLA-Permissive-2.0",      # webpki-roots: Mozilla CA bundle data, permissive data licence
    "OpenSSL",                  # only via ring's legacy licence text, if it reappears
]
confidence-threshold = 0.9
# Allow-list entries above cover crates that may come and go with dependency updates.
unused-allowed-license = "allow"

[advisories]
yanked = "deny"
unmaintained = "all"
ignore = [
    # atomic-polyfill: unmaintained (no vulnerability). Pulled in by postcard 1.x -> heapless 0.7.
    # Goes away when postcard moves to heapless 0.8+; nothing to do on our side.
    { id = "RUSTSEC-2023-0089", reason = "transitive via postcard/heapless 0.7, unmaintained only" },
    # pin-utils: unmaintained (no vulnerability). Only reached through the aws-sdk-s3 dev-dependency.
    { id = "RUSTSEC-2026-0441", reason = "dev-only via aws-smithy-*, unmaintained only" },
    # rustls-pemfile: archived; superseded by rustls-pki-types' PemObject. Direct dependency of
    # cairn-server (TLS cert loading); migration tracked for phase 2a (B6 PEM reload).
    { id = "RUSTSEC-2025-0134", reason = "direct dep of cairn-server; migrate to rustls-pki-types PemObject in 2a" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Pure-Rust policy (AGENTS.md): no OpenSSL / native-tls anywhere in the graph.
    { name = "openssl", reason = "rustls only" },
    { name = "openssl-sys", reason = "rustls only" },
    { name = "native-tls", reason = "rustls only" },
    { name = "rocksdb", reason = "no C++ storage engines" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
