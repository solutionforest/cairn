# promtool test rules deploy/prometheus/tidemark-alerts.test.yml
rule_files: [tidemark-alerts.yml]
evaluation_interval: 1m

tests:
  - name: healthy server fires nothing
    interval: 1m
    input_series:
      - series: 'up{job="tidemark",instance="a"}'
        values: '1x120'
      - series: 'tidemark_disk_free_bytes{job="tidemark",instance="a"}'
        values: '100000000000x120'
      - series: 'tidemark_disk_reserve_bytes{job="tidemark",instance="a"}'
        values: '1073741824x120'
      - series: 'tidemark_damaged_blobs{job="tidemark",instance="a"}'
        values: '0x120'
      - series: 'tidemark_trash_bytes{job="tidemark",instance="a"}'
        values: '5000000000x120'
      - series: 'tidemark_live_bytes{job="tidemark",instance="a"}'
        values: '50000000000x120'
      - series: 'tidemark_gc_last_success_timestamp_seconds{job="tidemark",instance="a"}'
        values: '0+60x120'
      - series: 'tidemark_requests_total{job="tidemark",instance="a",op="GetObject",status="200"}'
        values: '0+600x120'
      - series: 'tidemark_requests_total{job="tidemark",instance="a",op="GetObject",status="500"}'
        values: '0+1x120'
      - series: 'tidemark_backup_last_success_timestamp_seconds{instance="a"}'
        values: '0+60x120'
    alert_rule_test:
      - { eval_time: 119m, alertname: TidemarkDown, exp_alerts: [] }
      - { eval_time: 119m, alertname: TidemarkDiskNearReserve, exp_alerts: [] }
      - { eval_time: 119m, alertname: TidemarkDiskFillingUp, exp_alerts: [] }
      - { eval_time: 119m, alertname: TidemarkStorageFull, exp_alerts: [] }
      - { eval_time: 119m, alertname: TidemarkDamagedBlobs, exp_alerts: [] }
      - { eval_time: 119m, alertname: TidemarkTrashLargerThanData, exp_alerts: [] }
      - { eval_time: 119m, alertname: TidemarkGcStalled, exp_alerts: [] }
      - { eval_time: 119m, alertname: TidemarkHighErrorRate, exp_alerts: [] }
      - { eval_time: 119m, alertname: TidemarkBackupStale, exp_alerts: [] }

  - name: down
    interval: 1m
    input_series:
      - series: 'up{job="tidemark",instance="a"}'
        values: '1 1 0 0 0 0'
    alert_rule_test:
      - eval_time: 5m
        alertname: TidemarkDown
        exp_alerts:
          - exp_labels: { severity: critical, job: tidemark, instance: a }
            exp_annotations:
              summary: "Tidemark a is not answering /metrics"

  - name: disk near reserve, and the reserve-off floor
    interval: 1m
    input_series:
      - series: 'tidemark_disk_free_bytes{instance="a"}'
        values: '1500000000x20'
      - series: 'tidemark_disk_reserve_bytes{instance="a"}'
        values: '1073741824x20'
      - series: 'tidemark_disk_free_bytes{instance="b"}'
        values: '1000000000x20'
      - series: 'tidemark_disk_reserve_bytes{instance="b"}'
        values: '0x20'
      - series: 'tidemark_disk_free_bytes{instance="c"}'
        values: '3000000000x20'
      - series: 'tidemark_disk_reserve_bytes{instance="c"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: TidemarkDiskNearReserve
        exp_alerts:
          - exp_labels: { severity: critical, instance: a }
            exp_annotations:
              summary: "Tidemark a: 1.397GiB free, writes stop at the reserve"
              runbook: "OPERATIONS.md#disk-full"
          - exp_labels: { severity: critical, instance: b }
            exp_annotations:
              summary: "Tidemark b: 953.7MiB free, writes stop at the reserve"
              runbook: "OPERATIONS.md#disk-full"

  - name: disk filling up within a day
    interval: 1m
    input_series:
      # 100 GB free, losing 100 MB a minute: about 16 h to the reserve.
      - series: 'tidemark_disk_free_bytes{instance="a"}'
        values: '100000000000-100000000x600'
      - series: 'tidemark_disk_reserve_bytes{instance="a"}'
        values: '1073741824x600'
    alert_rule_test:
      - eval_time: 8h
        alertname: TidemarkDiskFillingUp
        exp_alerts:
          - exp_labels: { severity: warning, instance: a }
            exp_annotations:
              summary: "Tidemark a reaches its free-space reserve within 24 h at the current rate"

  - name: storage full 507s
    interval: 1m
    input_series:
      - series: 'tidemark_requests_total{instance="a",op="PutObject",status="507"}'
        values: '0 0 3 5'
    alert_rule_test:
      - eval_time: 3m
        alertname: TidemarkStorageFull
        exp_alerts:
          - exp_labels: { severity: critical, instance: a, op: PutObject, status: "507" }
            exp_annotations:
              summary: "Tidemark a is rejecting writes with 507 (free space below reserve)"
              runbook: "OPERATIONS.md#disk-full"

  - name: damaged blobs
    interval: 1m
    input_series:
      - series: 'tidemark_damaged_blobs{instance="a"}'
        values: '0 0 2'
    alert_rule_test:
      - { eval_time: 1m, alertname: TidemarkDamagedBlobs, exp_alerts: [] }
      - eval_time: 2m
        alertname: TidemarkDamagedBlobs
        exp_alerts:
          - exp_labels: { severity: critical, instance: a }
            exp_annotations:
              summary: "Tidemark a: 2 damaged blob(s); run `tidemark fsck` and restore from backup"
              runbook: "OPERATIONS.md#fsck-and-scrub"

  - name: trash larger than live data for 6 h
    interval: 1m
    input_series:
      - series: 'tidemark_trash_bytes{instance="a"}'
        values: '20000000000x480'
      - series: 'tidemark_live_bytes{instance="a"}'
        values: '10000000000x480'
    alert_rule_test:
      - { eval_time: 5h, alertname: TidemarkTrashLargerThanData, exp_alerts: [] }
      - eval_time: 7h
        alertname: TidemarkTrashLargerThanData
        exp_alerts:
          - exp_labels: { severity: warning, instance: a }
            exp_annotations:
              summary: "Tidemark a: trash (18.63GiB) is larger than live data"

  - name: gc stalled
    interval: 1m
    input_series:
      # GC succeeds for 10 min, then never again.
      - series: 'tidemark_gc_last_success_timestamp_seconds{instance="a"}'
        values: '0+60x10 600x100'
    alert_rule_test:
      - { eval_time: 70m, alertname: TidemarkGcStalled, exp_alerts: [] }
      - eval_time: 90m
        alertname: TidemarkGcStalled
        exp_alerts:
          - exp_labels: { severity: warning, instance: a }
            exp_annotations:
              summary: "Tidemark a: no successful GC pass for over an hour (check logs for `gc tick failed`)"

  - name: high 5xx rate
    interval: 1m
    input_series:
      - series: 'tidemark_requests_total{instance="a",op="GetObject",status="200"}'
        values: '0+60x30'
      - series: 'tidemark_requests_total{instance="a",op="GetObject",status="503"}'
        values: '0+20x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: TidemarkHighErrorRate
        exp_alerts:
          - exp_labels: { severity: warning, instance: a }
            exp_annotations:
              summary: "Tidemark a: 25% of requests fail with 5xx"

  - name: dead letters, audit drops, stale backup
    interval: 1m
    input_series:
      - series: 'tidemark_events_dead_lettered_total{instance="a",sink="hook"}'
        values: '0 0 1'
      - series: 'tidemark_audit_dropped_total{instance="a"}'
        values: '0 0 7'
      - series: 'tidemark_backup_last_success_timestamp_seconds{instance="a"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 2m
        alertname: TidemarkEventsDeadLettered
        exp_alerts:
          - exp_labels: { severity: warning, instance: a, sink: hook }
            exp_annotations:
              summary: "Tidemark a: events to sink hook were dead-lettered"
      - eval_time: 2m
        alertname: TidemarkAuditDropped
        exp_alerts:
          - exp_labels: { severity: warning, instance: a }
            exp_annotations:
              summary: "Tidemark a: audit records dropped (writer behind)"
      - { eval_time: 120m, alertname: TidemarkBackupStale, exp_alerts: [] }
      - eval_time: 140m
        alertname: TidemarkBackupStale
        exp_alerts:
          - exp_labels: { severity: warning, instance: a }
            exp_annotations:
              summary: "No successful Tidemark backup on a for over 2 h"
