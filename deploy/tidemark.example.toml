# Tidemark configuration reference. Every key is shown with its default value; delete what you do
# not change. Load with `tidemark serve --config /etc/tidemark/tidemark.toml`.
#
# Environment overrides: TIDEMARK_<SECTION>_<KEY>=value (e.g. TIDEMARK_SERVER_LISTEN=0.0.0.0:9000,
# TIDEMARK_STORAGE_FSYNC=false), plus the aliases TIDEMARK_DATA_DIR, TIDEMARK_ROOT_ACCESS_KEY and
# TIDEMARK_ROOT_SECRET. Durations accept "500ms", "15s", "10m", "12h", "30d", "2w" or a bare number
# of seconds. Unknown keys are rejected at startup.
#
# Kept in sync with crates/tidemark-core/src/config.rs by
# crates/tidemark-events/tests/deploy_example_config.rs (parses this file, expects the defaults).

[server]
# Address and port to listen on. Use 0.0.0.0:9000 to accept remote clients.
listen = "127.0.0.1:9000"
# Region name reported to clients and used in SigV4 scopes.
region = "us-east-1"
# Base domain for virtual-host-style requests (bucket.s3.example.com). Path-style always works.
# Unset by default.
# domain = "s3.example.com"
# TLS certificate chain and private key (PEM). Both unset = plain HTTP (put a TLS-terminating
# reverse proxy in front, or set both).
# tls_cert = "/etc/tidemark/tls/fullchain.pem"
# tls_key = "/etc/tidemark/tls/privkey.pem"

[storage]
# Root of all on-disk state: meta/tidemark.redb, blobs/, tmp/, keys/.
data_dir = "./data"
# fsync blobs and metadata before acknowledging writes. Only disable for throwaway test data.
fsync = true
# Re-hash blob content while streaming GETs and fail the request on mismatch (costs CPU).
verify_on_read = false
# Encrypt every blob at rest with a key derived from the master key in <data_dir>/keys/.
encrypt_at_rest = false

[retention]
# How long soft-deleted versions stay restorable from the trash.
soft_delete = "30d"
# How long superseded (shadow) versions are kept for point-in-time recovery.
shadow_history = "30d"
# Minimum number of versions kept per key regardless of age.
min_versions_kept = 1
# Delay between a blob's refcount reaching zero and the file being unlinked.
gc_grace = "1h"
# How often the garbage collector runs.
gc_interval = "1m"

[auth]
# Root credentials. Normally generated by `tidemark init` and stored in the data dir; set here (or
# via TIDEMARK_ROOT_ACCESS_KEY / TIDEMARK_ROOT_SECRET) only for automated deployments. Prefer the
# environment or a file readable only by the tidemark user. Unset by default.
# root_access_key = "TDMKROOTEXAMPLE0"
# root_secret_key = "change-me-to-40-random-characters-......."
# Accept unsigned requests. They are still subject to bucket policies (phase 2).
allow_anonymous = false

[limits]
# Max size of a single PUT in bytes (5 GiB, the S3 limit).
max_object_size = 5368709120
# Max multipart part size in bytes (5 GiB).
max_part_size = 5368709120
# Min size of every part except the last (5 MiB).
min_part_size = 5242880
# Max parts per multipart upload.
max_parts = 10000
# Max total size of user metadata (x-amz-meta-*) in bytes.
max_metadata_size = 2048

[events]
# Run delivery workers for configured sinks (webhooks, function sinks). No sinks = no-op.
enabled = true

[mcp]
# Serve the MCP (Model Context Protocol) endpoint at /mcp.
enabled = false

[metrics]
# Serve Prometheus metrics at /metrics.
enabled = true

[log]
# tracing env-filter directive, e.g. "info", "tidemark=debug,info".
level = "info"
# Emit JSON log lines instead of human-readable text.
json = false
